cache_h5: ./outputs/clinvar/cache.h5
window:
  half_bp: 2500
  left: 4375
  right: 4375
  coverage: true
rbf:
  num_centers: 16
  trainable: false
  per_channel: false
  gamma: null
  trainable_gamma: false
marker:
  enabled: false
model:
  d_model: 128
  n_layers: 4
  d_state: 64
  d_conv: 4
  expand: 2
  headdim: 64
  dropout: 0.1
  pool: max
  bidirectional: false
train:
  lr: 0.0003
  weight_decay: 0.05
  pos_weight: 3.2
  batch_size: 64
  max_epochs: 50
  patience: 8
  num_workers: 8
  preload: false
  device: cuda
  out_dir: ./outputs/spf/fold0
split:
  seed: 42
  ratios:
  - 0.7
  - 0.15
  - 0.15
  freeze_npz: ./outputs/clinvar/folds/fold0_split_cc_seed42.npz
  splice_mask_npz: ./outputs/clinvar/anchors/anchor_selection_v50mane.npz
  splice_mask_key: train_mask
feature:
  enabled: true
  scalar_npz: ./outputs/clinvar/scalars.npz
  scalar_key: scalars
