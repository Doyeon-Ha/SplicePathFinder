[project]
name = "splicepathfinder"
version = "1.0.0"
license = "Apache-2.0"
description = "SplicePath and SplicePathFinder paper reproduction"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "biopython>=1.85",
    "causal-conv1d==1.6.1",
    "cyvcf2>=0.31.1",
    "einops==0.8.1",
    "filelock>=3.18.0",
    "h5py>=3.16.0",
    "hydra-core==1.3.2",
    "intervaltree>=3.1.0",
    "mamba-ssm==2.3.2.post1",
    "numpy==2.3.1",
    "omegaconf==2.3.0",
    "openpyxl>=3.1.5",
    "pandas==2.3.1",
    "pyfaidx==0.8.1.4",
    "pyyaml>=6.0.2",
    "scikit-learn==1.7.0",
    "scipy==1.16.0",
    "matplotlib==3.10.3",
    "torch==2.11.0",
    "tqdm==4.67.1",
    "transformers==4.53.1",
    "pybigwig>=0.3.25",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.3",
]

[tool.uv]
no-build-isolation-package = ["causal-conv1d", "mamba-ssm"]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools]
packages = ["model", "train", "process_input", "test", "utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
# rules to apply
lint.select = ["ANN001", "ANN201", "D100", "D101", "D102", "D103", "D401", "D403", "D417", "E5", "E7", "E9", "F4", "F8", "I"]

# rules to ignore
lint.ignore = []

# directory/files to skip checking
exclude = [".git", "**/test", "**/__init__.py"]

# code style
line-length = 88
target-version = "py312"

# auto fix
fix = true
unsafe-fixes = true
